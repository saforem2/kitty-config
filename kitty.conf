# U+1F600-U+1F64F (smileys) to "noto color emoji", which did nothing for the
# emoji actually in use -- 🚀 U+1F680, 🌟 U+1F31F, 📊 U+1F4CA are all outside
# that range -- and named a font that was not what rendered.
#
# The real problem was WIDTH, not font selection: our text font is Iosevka25
# *Condensed* (narrow cells), while emoji glyphs are ~1:1 square. A square
# glyph drawn across two condensed cells overflows and gets clipped on the
# sides. narrow_symbols pins the emoji planes to exactly 2 cells so kitty
# scales them to fit instead of overflowing.
narrow_symbols U+1F300-U+1FAFF 2
narrow_symbols U+2600-U+27BF 2


macos_thicken_font 0.01

# font_family      family='Iosevka SFNormalSans' style='Condensed' postscript_name=Iosevseka25 features='+calt +dlig +ss15 -zero -ss03 +ss05'
# font_family      family='Iosevka SS18'

# bold_font        family='Iosevka SFNormalSans' style='Bold Condensed' features='+calt +dlig +ss15 -zero -ss03 +ss05'
# italic_font      family='Iosevka SFNormalSans' style='Condensed Italic' features='+calt +dlig +ss15 -zero -ss03 +ss05'
# bold_italic_font family='Iosevka SFNormalSans' style='Bold Condensed Italic' features='+calt +dlig +ss15 -zero -ss03 +ss05'
# modify_font                     cell_width 100%
# modify_font                     cell_width 75%
# modify_font                     cell_height 90%

# modify_font                     cell_width 95%
font_size 14.0
# modify_font cell_width 85%
# modify_font cell_height -2px
# modify_font baseline 3

# END_KITTY_FONTS
