# drag_threshold 5

#: The threshold distance the mouse must move to start a drag and
#: drop. Dragging works for tabs and windows. You can drag tabs to re-
#: order them, detach them into new OS Windows or move them to another
#: OS Window. Similarly, by dragging the titlebar of a window (see
#: toggle_window_title_bars) you can re-order it in its layout, detach
#: it or move it to another tab. A value of zero disables all
#: dragging.

#: Note that on Wayland, because of poor design
#: <https://gitlab.freedesktop.org/wayland/wayland/-/issues/140>
