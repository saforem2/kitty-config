# vim:ft=kitty

# Floating panel — centered overlay, 80x10 cells
edge center-sized
lines 10
columns 80
active_border_color #FF1A8F
inactive_border_color #888888

# Semi-transparent background
background_opacity 1.0

# Auto-hide when clicking elsewhere
hide_on_focus_loss no

# Start hidden; the macOS Service shortcut toggles visibility
start_as_hidden yes

# Font override for the panel
# kitty_override font_size=14
#
draw_window_borders_for_single_window yes
window_border_width 2pt
draw_minimal_borders no
