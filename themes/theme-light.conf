# vim:ft=kitty

## name:     Custom light theme (based on Catppuccin-Latte)
## upstream: https://github.com/catppuccin/kitty/blob/main/latte.conf

# The basic colors
foreground              oklch(0.43547 0.04301 279.325)
background              oklch(1.00000 0.00001 89.876)
selection_foreground    oklch(0.00000 0.00001 0.000)
selection_background    oklch(0.91347 0.16664 144.061)

# Cursor colors
cursor                  oklch(0.65537 0.25769 358.383)
cursor_text_color       oklch(0.95776 0.00577 264.532)

# URL underline color when hovering with mouse
url_color               oklch(0.59692 0.20378 257.132)

# Kitty window border colors
active_border_color     oklch(0.65537 0.25769 358.383)
inactive_border_color   oklch(0.94912 0.00001 89.876)
bell_border_color       oklch(0.86657 0.16466 88.684)

inactive_text_alpha 0.5

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

