# vim:ft=kitty

## name:     Custom light theme (based on Catppuccin-Latte)
## upstream: https://github.com/catppuccin/kitty/blob/main/latte.conf

# The basic colors
foreground              #4C4F69
background              #FFFFFF
selection_foreground    #000000
selection_background    #99FF99

# Cursor colors
cursor                  #FF1A8F
cursor_text_color       #EFF1F5

# URL underline color when hovering with mouse
url_color               #137AF5

# Kitty window border colors
active_border_color     #FF1A8F
inactive_border_color   #eeeeee
bell_border_color       #FFCC33

inactive_text_alpha 0.5

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #7a7a7a
active_tab_background   #cccccc
inactive_tab_foreground #bbbbbb
inactive_tab_background #f8f8f8
tab_bar_background      #f8f8f8

# The 16 terminal colors
color0  #000000
color8  #888888
color1  #FF8a80
color9  #F44336
color2  #05A551
color10 #00C853
# color3 #FF794E
# color3  #FFD43B
# color3  #FAB005
color3  #FD971F
color11 #FF794E
color4  #2196F3
color12 #1E66F5
color5  #8260CC
color13 #FF3399
