# Open any file with a fragment in vim, fragments are generated by the
# hyperlink_grep kitten and nothing else so far
protocol file
fragment matches [0-9]+
action launch --type=overlay vim +${FRAGMENT} ${FILE_PATH}

# Open text files without fragments in the editor
protocol file
mime text/*
action launch --type=overlay zsh -c 'nvim ${FILE_PATH}'

# Open any image in the full kitty window by clicking on it
# protocol file
# mime image/*
# action launch --type=overlay zsh -c 'kitty +kitten icat --hold ${FILE_PATH}'

# Tail a log file (*.log) in a new OS window and reduce its font size
protocol file
ext log
action launch --title ${FILE} --type=os-window tail -f ${FILE_PATH}
action change_font_size current -2

# Open directories
protocol file
mime inode/directory
action launch --type=os-window --cwd $FILE_PATH

# Open any image in the full kitty window by clicking on it
protocol file
mime image/*
action launch --type=overlay kitten icat --hold -- ${FILE_PATH}
