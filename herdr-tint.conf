# Shared Herdr tint for mbph and mbpr. Read by herdr-theme.
#
# Lives in the repo rather than ~/.config/herdr/tint.conf because sync-theme
# invokes herdr-theme from Hammerspoon on every macOS appearance change, with
# no login shell -- exported vars are invisible there and the tint silently
# reverted. Keeping it here also means both machines get the same treatment
# after a pull. Environment vars (HERDR_*) still override for one-off runs.
#
# SIDEBAR_TINT=accent follows the resolved kitty accent per mode instead of
# pinning one hue: pink on light (kitty's authored accent), yellow on dark.
# This supersedes the earlier shared-pink pin (SIDEBAR_TINT=ACCENT_TINT=
# #db2587). That pinned BOTH modes to light's pink, which meant dark stopped
# inheriting kitty at all -- the thing the inherit was added to do.
#
# Measured, both modes (sidebar/panel, active_row/sidebar):
#   accent-follow  1.20 / 1.16   1.33 / 1.37   <- matches the untinted baseline
#   shared pink    1.33 / 1.24   1.20 / 1.28
#
# ACCENT_TINT is deliberately unset. It REPLACES the kitty accent rather than
# shifting it, so setting it re-breaks the inherit. Set it only to override a
# theme's accent on purpose.

SIDEBAR_TINT=accent
SIDEBAR_TINT_STRENGTH=0.10
